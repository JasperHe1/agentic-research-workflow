[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research-workflow"
version = "0.1.0"
description = "An auditable, human-gated agent workflow for strategy research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Junjia He"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
agentic-research = "agentic_research_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

